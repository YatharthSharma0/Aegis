# Aegis local development stack.
# Phase 0: backend + frontend only. PostgreSQL, Neo4j, and Redis are added
# in later phases when persistence and workers land.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AEGIS_ENVIRONMENT: development
      AEGIS_CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend
