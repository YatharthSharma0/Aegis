# Aegis local development stack.
# Phase 2: Postgres + backend (API) + worker (durable trace queue) + frontend.
# Neo4j is added when its feature lands.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AEGIS_ENVIRONMENT: development
      AEGIS_CORS_ORIGINS: '["http://localhost:5173"]'
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis@db:5432/aegis
      AEGIS_TRACE_WORKER: external   # the `worker` service drains the queue
      AEGIS_LOG_JSON: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: ["uv", "run", "--no-dev", "python", "-m", "app.worker"]
    environment:
      AEGIS_ENVIRONMENT: development
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis@db:5432/aegis
      AEGIS_SKIP_MIGRATIONS: "1"    # the backend service runs them
      AEGIS_LOG_JSON: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  db-data:
