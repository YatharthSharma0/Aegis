[project]
name = "aegis-backend"
version = "0.0.0"
description = "Aegis backend — real-time crypto fraud attribution (SIH26183)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# The gate type-checks `app` only (see scripts/validate.sh); tests use pytest's
# own runtime checks. Add a `tests.*` override here if that changes.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Fail a stalled test loudly instead of hanging the validation gate
# (e.g. a wedged TestClient / event loop on some environments).
timeout = 30
